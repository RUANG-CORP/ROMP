name: Build & Release ROMP APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag rilis GitHub (contoh: v2.10). Kosongkan untuk otomatis dari tanggal/run'
        required: false
        default: ''
      create_release:
        description: 'Publikasikan ke GitHub Releases?'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build & Verify Phone Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK Build-Tools 34, CMake 3.22.1 & NDK 25.1
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -w "$SDK_ROOT" ]; then
            sudo chmod -R a+rwX "$SDK_ROOT"
          fi
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;25.1.8937393"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Run parity & integrity unit tests
        run: python -m unittest discover -s tests -v

      - name: Configure release signing keystore
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > romp-release.jks
            cat > keystore.properties <<EOF
          storeFile=romp-release.jks
          storePassword=${RELEASE_STORE_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          keyPassword=${RELEASE_KEY_PASSWORD}
          EOF
            echo "Using repository signing secret keystore."
          else
            echo "ephemeral=true" >> "$GITHUB_OUTPUT"
            EPHEMERAL_PASS="romp-ci-ephemeral-${GITHUB_RUN_ID}"
            keytool -genkeypair -v \
              -keystore romp-release.jks \
              -storepass "$EPHEMERAL_PASS" \
              -alias romp \
              -keypass "$EPHEMERAL_PASS" \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=ROMP by HARFA CI, OU=Mobile, O=HARFA, L=Jakarta, ST=Jakarta, C=ID"
            cat > keystore.properties <<EOF
          storeFile=romp-release.jks
          storePassword=${EPHEMERAL_PASS}
          keyAlias=romp
          keyPassword=${EPHEMERAL_PASS}
          EOF
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not set; generated an ephemeral signing key for this CI run."
          fi

      - name: Build Android Release APK via Gradle
        shell: bash
        run: |
          set +o pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          if ! ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle_build.log; then
            ERR_SUMMARY=$(grep -A4 -E "FAILURE:|What went wrong:|Execution failed" gradle_build.log | head -n 30 | tr '\n' ' ')
            echo "::error::${ERR_SUMMARY}"
            exit 1
          fi

      - name: Resolve release version label
        id: version
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "$INPUT_RELEASE_TAG" ]; then
            TAG="$INPUT_RELEASE_TAG"
          else
            TAG="v2.10-b${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Package & sign slim ARM64 and universal Phone Release APKs
        shell: bash
        run: |
          set +o pipefail
          TAG="${{ steps.version.outputs.tag }}"
          ls -la app/build/outputs/apk/release/ keystore.properties romp-release.jks replica/engine_dex/ || true
          if ! (
            python scripts/package_3d_engine.py \
              --variant release \
              --abis arm64-v8a \
              --out "dist/ROMP-by-HARFA-${TAG}-arm64-v8a-release.apk" && \
            python scripts/package_3d_engine.py \
              --variant release \
              --abis arm64-v8a,armeabi-v7a \
              --out "dist/ROMP-by-HARFA-${TAG}-release.apk"
          ) 2>&1 | tee package_apk.log; then
            ERR_SUMMARY=$(tail -n 20 package_apk.log | tr '\n' ' ')
            echo "::error::Package failed: ${ERR_SUMMARY}"
            exit 1
          fi

      - name: Verify APK signatures, zipalign, & SHA-256 checksums
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME}"
          BT_DIR="$SDK_ROOT/build-tools/34.0.0"
          for apk in dist/*.apk; do
            echo "=== Verifying $apk ==="
            "$BT_DIR/zipalign" -c -p 4 "$apk"
            "$BT_DIR/apksigner" verify --verbose --print-certs "$apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload Release APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ROMP-by-HARFA-${{ steps.version.outputs.tag }}-apks
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: |
          github.event_name != 'pull_request' &&
          (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ROMP by HARFA ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ROMP by HARFA (${{ steps.version.outputs.tag }})

            - **Khusus HP 64-bit Modern *(Rekomendasi: Redmi Note 10 Pro & HP 2018+)***: `ROMP-by-HARFA-${{ steps.version.outputs.tag }}-arm64-v8a-release.apk` (~54 MB)
            - **Universal Semua HP (`arm64-v8a` + `armeabi-v7a`)**: `ROMP-by-HARFA-${{ steps.version.outputs.tag }}-release.apk` (~82 MB)
            - **Checksum**: lihat `SHA256SUMS.txt`
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Clean up temporary signing files
        if: always()
        shell: bash
        run: rm -f romp-release.jks keystore.properties
